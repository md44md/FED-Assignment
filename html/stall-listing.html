<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hawker Centre Management System - Stall Listing</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/stall-listing.css">
</head>
<body>
    <header>
        <div class="branding">
            <img src="/images/NEA-logo.png" alt="NEA logo">
        </div>
        
        <div class="nav-bar">
            <a href="javascript:history.back()" class="back-btn">&larr;</a>
            <div class="nav-main">
                <div class="title">Stall Listing</div>
            </div>
            <a href="#" class="dashboard">Dashboard</a>
        </div>
    </header>
    <main>
        <section class="container">
            <!-- Functional buttons -->
            <button class="stall-card-btn">
                <div class="stall-img-wrapper">
                    <img class="stall-img" src="" alt="Tan Ah Beng Chicken Rice Logo">
                </div>
                <h3 class="stall-name">Tan Ah Beng Chicken Rice</h3>
            </button>
            <button class="stall-card-btn">
                <div class="stall-img-wrapper">
                    <img class="stall-img" src="" alt="Warisan Rasa Logo">
                </div>
                <h3 class="stall-name">Warisan Rasa</h3>
            </button>
            <button class="stall-card-btn">
                <div class="stall-img-wrapper">
                    <img class="stall-img" src="" alt="Masala Magic Logo">
                </div>
                <h3 class="stall-name">Masala Magic</h3>
            </button>

            <!-- Non-functional buttons -->
             <button class="stall-card-btn">
                <div class="stall-img-wrapper">
                    <img class="stall-img" src="" alt="Ah Seng's Kitchen Logo">
                </div>
                <h3 class="stall-name">Ah Seng's Kitchen</h3>
            </button>
            <button class="stall-card-btn">
                <div class="stall-img-wrapper">
                    <img class="stall-img" src="" alt="Ah Huat Food House Logo">
                </div>
                <h3 class="stall-name">Ah Huat Food House</h3>
            </button>
            <button class="stall-card-btn">
                <div class="stall-img-wrapper">
                    <img class="stall-img" src="" alt="Golden Wok Logo">
                </div>
                <h3 class="stall-name">Golden Wok</h3>
            </button>
            <button class="stall-card-btn">
                <div class="stall-img-wrapper">
                    <img class="stall-img" src="" alt="Selera Nusantara Logo">
                </div>
                <h3 class="stall-name">Selera Nusantara</h3>
            </button>
            <button class="stall-card-btn">
                <div class="stall-img-wrapper">
                    <img class="stall-img" src="" alt="Dapur Mak Cik Logo">
                </div>
                <h3 class="stall-name">Dapur Mak Cik</h3>
            </button>
            <button class="stall-card-btn">
                <div class="stall-img-wrapper">
                    <img class="stall-img" src="" alt="Old Town Flavours Logo">
                </div>
                <h3 class="stall-name">Old Town Flavours</h3>
            </button>
            <button class="stall-card-btn">
                <div class="stall-img-wrapper">
                    <img class="stall-img" src="" alt="Warung Selera Logo">
                </div>
                <h3 class="stall-name">Warung Selera</h3>
            </button>
            <button class="stall-card-btn">
                <div class="stall-img-wrapper">
                    <img class="stall-img" src="" alt="Ravi Prata Logo">
                </div>
                <h3 class="stall-name">Ravi Prata</h3>
            </button>   
            <button class="stall-card-btn">
                <div class="stall-img-wrapper">
                    <img class="stall-img" src="" alt="Southern Delights Logo">
                </div>
                <h3 class="stall-name">Southern Delights</h3>
            </button>                                              
         </section>   
    </main>
    <footer>
        <p>© 2026 National Environment Agency. All rights reserved.</p>
    </footer>

</body>
</html>
