<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - NEA Officer</title>
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/haobin.css">
</head>
<body class="auth-page" data-role="nea">
  <header>
    <div class="branding">
      <img src="../../images/NEA-logo.png" alt="NEA logo">
    </div>

    <div class="nav-bar">
      <a href="../index.html" class="back-btn">&larr;</a>
      <div class="nav-main">
        <div class="title">NEA OFFICER</div>
      </div>
      <div style="width:160px;"></div>
    </div>
  </header>

  <main class="auth-main">
    <div class="auth-wrap">
      <section class="auth-card">
        <h2>Sign In</h2>

        <form id="loginForm" novalidate>
          <input id="loginIdentifier" class="auth-input" type="text" placeholder="Email or phone number">
          <div id="loginIdentifierErr" class="auth-error"></div>

          <input id="loginPassword" class="auth-input" type="password" placeholder="Password">
          <div id="loginPasswordErr" class="auth-error"></div>

          <div id="loginMsg" class="auth-msg"></div>

          <button class="auth-btn" type="submit">Log in</button>
        </form>
      </section>
    </div>
  </main>

  <footer>
    <p>© 2026 National Environment Agency. All rights reserved.</p>
  </footer>

  <script type="module" src="/js/hayder.js"></script>
</body>
</html>
