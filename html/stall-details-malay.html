<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hawker Centre Management System - Stall Details</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/stall-details.css">
</head>
<body>
    <header>
        <div class="branding">
            <img src="/images/NEA-logo.png" alt="NEA logo">
        </div>

        <div class="nav-bar">
            <a href="javascript:history.back()" class="back-btn">&larr;</a>
            <div class="nav-main">
                <div class="title">Stall Details</div>
                <ul class="primary-links">
                    <li><a href="#" class="active">Stall Details</a></li>
                    <li><a href="#">Menu</a></li>
                    <li><a href="#">Give Feedback</a></li>

    <main>
        <div class="card">
            <div class="img-and-info">

                    <p>Warisan Rasa</p>

                <p>About the stall:</p>

            </div>

        <p>© 2026 National Environment Agency. All rights reserved.</p>
    </footer>
