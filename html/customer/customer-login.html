<!DOCTYPE html>

<head>
  <meta charset="UTF-8">

  <title>Sign In - Customer</title>
  <link rel="stylesheet" href="../../css/main.css">

<body class="auth-page">
  <header>
    <div class="branding">
      <img src="../../images/NEA-logo.png" alt="NEA logo">
    </div>

    <div class="nav-bar">
      <a href="javascript:history.back()" class="back-btn">&larr;</a>
      <div class="nav-main">
        <div class="title">CUSTOMER</div>
      </div>
      <div style="width:160px;"></div>
    </div>
  </header>

  <main class="auth-main">
    <div class="auth-wrap">
      <section class="auth-card">
        <h2>Sign In</h2>

        <form id="loginForm" novalidate>
          <input id="loginIdentifier" class="auth-input" type="text" placeholder="Email or phone number">
          <div id="loginIdentifierErr" class="auth-error"></div>

          <input id="loginPassword" class="auth-input" type="password" placeholder="Password">
          <div id="loginPasswordErr" class="auth-error"></div>

          <div id="loginMsg" class="auth-msg"></div>

          <button class="auth-btn" type="submit">Log in</button>
        </form>
      </section>

      <div class="auth-or">Or</div>

      <a class="auth-linkbtn" href="./customer-register.html">Create an account</a>
    </div>
  </main>

  <footer>
    <p>© 2026 National Environment Agency. All rights reserved.</p>
  </footer>
