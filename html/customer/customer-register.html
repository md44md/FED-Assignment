<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Customer</title>
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/haobin.css">
</head>
<body class="auth-page">
  <header>
    <div class="branding">
      <img src="../../images/NEA-logo.png" alt="NEA logo">
    </div>

    <div class="nav-bar">
      <a href="javascript:history.back()" class="back-btn">&larr;</a>
      <div class="nav-main">
        <div class="title">CUSTOMER</div>
      </div>
      <div style="width:160px;"></div>
    </div>
  </header>

  <main class="auth-main">
    <div class="auth-wrap">
      <section class="auth-card">
        <h2>Sign Up</h2>

        <form id="registerForm" novalidate>
          <input id="regName" class="auth-input" type="text" placeholder="Name">
          <div id="regNameErr" class="auth-error"></div>

          <input id="regEmail" class="auth-input" type="email" placeholder="Email">
          <div id="regEmailErr" class="auth-error"></div>

          <input id="regPhone" class="auth-input" type="text" placeholder="Phone Number">
          <div id="regPhoneErr" class="auth-error"></div>

          <input id="regPassword" class="auth-input" type="password" placeholder="Password">
          <div id="regPasswordErr" class="auth-error"></div>

          <div id="regMsg" class="auth-msg"></div>

          <button class="auth-btn" type="submit">Sign up</button>
        </form>
      </section>

      <div class="auth-or">Or</div>

      <a class="auth-linkbtn" href="./customer-login.html">Log in</a>
    </div>
  </main>

  <footer>
    <p>© 2026 National Environment Agency. All rights reserved.</p>
  </footer>

  <script src="/js/haobin.js"></script>
  <script>Auth.initCustomerRegister();</script>
</body>
</html>
