<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customer Register</title>
  <link rel="stylesheet" href="../../css/main.css" />
</head>
<body>
  <main class="container" style="max-width: 520px; margin: 40px auto; padding: 16px;">
    <h1>Create Customer Account</h1>
    <p style="opacity: 0.8; margin-top: 6px;">Register to access your dashboard and submit feedback.</p>

    <form id="registerForm" novalidate>
      <div style="margin: 12px 0;">
        <label for="fullName"><strong>Full Name</strong></label>
        <input id="fullName" type="text" autocomplete="name"
               style="width: 100%; padding: 10px; margin-top: 6px;" />
        <small id="fullNameErr" style="display:block; margin-top:6px;"></small>
      </div>

      <div style="margin: 12px 0;">
        <label for="email"><strong>Email</strong></label>
        <input id="email" type="email" autocomplete="email"
               style="width: 100%; padding: 10px; margin-top: 6px;" />
        <small id="emailErr" style="display:block; margin-top:6px;"></small>
      </div>

      <div style="margin: 12px 0;">
        <label for="password"><strong>Password</strong></label>
        <input id="password" type="password" autocomplete="new-password"
               style="width: 100%; padding: 10px; margin-top: 6px;" />
        <small id="passwordErr" style="display:block; margin-top:6px;"></small>
      </div>

      <div style="margin: 12px 0;">
        <label for="confirmPassword"><strong>Confirm Password</strong></label>
        <input id="confirmPassword" type="password" autocomplete="new-password"
               style="width: 100%; padding: 10px; margin-top: 6px;" />
        <small id="confirmPasswordErr" style="display:block; margin-top:6px;"></small>
      </div>

      <div id="formMsg" style="margin: 10px 0;"></div>

      <button type="submit" style="width: 100%; padding: 12px; cursor: pointer;">
        Register
      </button>

      <p style="margin-top: 14px;">
        Already have an account?
        <a href="./customer-login.html">Login</a>
      </p>
    </form>
  </main>

  <script src="../../js/auth.js"></script>
  <script>
    Auth.initRegisterPage("registerForm", "./customer-login.html");
  </script>
</body>
</html>
