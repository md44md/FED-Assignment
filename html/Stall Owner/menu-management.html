<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stall Owner - Menu Management</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/kang-zheng.css">
</head>
<body>
    <!-- Header section containing branding and navigation -->
    <header>
        <!-- NEA Logo -->
        <div class="branding">
            <img src="/images/NEA-logo.png" alt="NEA logo">
        </div>
        
        <!-- Navigation bar with back button, title, and dashboard label -->
        <nav class="nav-bar">
            <a href="/html/Stall Owner/stall-owner-pages.html" class="back-btn">&larr;</a>
            <div class="nav-main">
                <div class="title">Menu Management</div>
                <div class="subtitle">Manage your menu efficiently</div>
            </div>
            <div class="dashboard">Stall Owner Dashboard</div>
        </nav>
    </header>

    <!-- Main content area -->
    <main class="menu-main">
        
        <!-- Add dish button + Summary stats -->
        <section class="menu-top-section">
            <button class="add-dish-btn" id="addDishBtn">+ Add New Dish</button>
            
            <!-- Summary statistics cards -->
            <div class="menu-stats">
                <div class="stat-card">
                    <div class="stat-value">12</div>
                    <div class="stat-label">Total Dishes</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">10</div>
                    <div class="stat-label">Active Dishes</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">3</div>
                    <div class="stat-label">Cuisines Available</div>
                </div>
            </div>
        </section>

        <!-- Search, Filters, and Dish grid -->
        <section class="menu-container">
            
            <!-- Search bar -->
            <div class="menu-search-bar">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Search in products" 
                    class="search-input"
                >
            </div>

            <!-- Filters section -->
            <div class="menu-filters">
                <!-- Cuisine filter dropdown -->
                <div class="filter-group">
                    <select id="cuisineFilter" class="filter-dropdown">
                        <option value="all">All Cuisines</option>
                        <option value="chinese">Chinese</option>
                        <option value="malay">Malay</option>
                        <option value="indian">Indian</option>
                    </select>
                    <button class="delete-filter-btn" onclick="deleteCuisineOption()">x</button>
                    <button class="add-filter-btn" id="addCuisineBtn">+</button>
                    <input 
                        type="text" 
                        id="newCuisineInput" 
                        class="new-filter-input" 
                        placeholder="New cuisine..." 
                        style="display: none;"
                    >
                </div>

                <!-- Food type filter buttons -->
                <div class="filter-group">
                    <button class="filter-btn active" data-type="all">Show All</button>
                    <button class="filter-btn" data-type="rice">Rice</button>
                    <button class="filter-btn" data-type="noodles">Noodles</button>
                    <button class="delete-filter-btn" onclick="deleteSelectedFoodType()">x</button>
                    <button class="add-filter-btn" id="addFoodTypeBtn">+</button>
                    <!-- Hidden input for adding new food type -->
                    <input 
                        type="text" 
                        id="newFoodTypeInput" 
                        class="new-filter-input" 
                        placeholder="New type..." 
                        style="display: none;"
                    >
                </div>
            </div>

            <!-- Dish grid -->
            <!-- NOTE: Using mock/sample data. Will be replaced with Firebase later -->
            <div class="dish-grid" id="dishGrid">
                <!-- Firebase loaded -->
            </div>
        </section>

    </main>

    <!-- MODAL POPUP: Create/Edit dish -->
    <div class="modal" id="dishModal">
        <div class="modal-overlay" onclick="closeModal()"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Create/Edit Dish</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            
            <form class="modal-form" id="dishForm">
                <!-- Dish name input -->
                <div class="form-group">
                    <label for="dishName">Dish Name</label>
                    <input 
                        type="text" 
                        id="dishName" 
                        placeholder="Set Dish name" 
                        required
                    >
                </div>

                <!-- Price input -->
                <div class="form-group">
                    <label for="dishPrice">Price ($)</label>
                    <input 
                        type="number" 
                        id="dishPrice" 
                        placeholder="Set Price ($)" 
                        step="0.10" 
                        min="0"
                        required
                    >
                </div>

                <!-- Cuisine type dropdown -->
                <div class="form-group">
                    <label for="dishCuisine">Select Cuisine type ⓘ</label>
                    <select id="dishCuisine" required>
                        <option value="">Select Cuisine</option>
                        <option value="chinese">Chinese</option>
                        <option value="malay">Malay</option>
                        <option value="indian">Indian</option>
                        <option value="singaporean">Singaporean</option>
                    </select>
                </div>

                <!-- Food type dropdown -->
                <div class="form-group">
                    <label for="dishFoodType">Select Food type ⓘ</label>
                    <select id="dishFoodType" required>
                        <option value="">Select Food Type</option>
                        <option value="rice">Rice</option>
                        <option value="noodles">Noodles</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <!-- Image upload -->
                <div class="form-group">
                    <label>Upload Image</label>
                    <div class="image-upload-box">
                        <input 
                            type="file" 
                            id="dishImage" 
                            accept="image/*" 
                            style="display: none;"
                        >
                        <button 
                            type="button" 
                            class="upload-btn" 
                            onclick="document.getElementById('dishImage').click()"
                        >
                            Choose File
                        </button>
                        <span id="fileName">No file chosen</span>
                    </div>
                </div>

                <!-- Action buttons -->
                <div class="modal-actions">
                    <button type="submit" class="apply-btn">Apply</button>
                    <button type="button" class="delete-btn" onclick="deleteDish()">Delete</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>© 2026 National Environment Agency. All rights reserved.</p>
    </footer>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="/js/kang-zheng.js"></script>
</body>
</html>
