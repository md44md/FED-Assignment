<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stall Owner - Promotions Management</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/kang-zheng.css">
</head>
<body>
    <!-- Header section -->
    <header>
        <!-- NEA Logo -->
        <div class="branding">
            <img src="/images/NEA-logo.png" alt="NEA logo">
        </div>
        
        <!-- Navigation bar -->
        <nav class="nav-bar">
            <a href="/html/Stall Owner/stall-owner-pages.html" class="back-btn">&larr;</a>
            <div class="nav-main">
                <div class="title">Promotions Management</div>
                <div class="subtitle">Manage your promotions efficiently</div>
            </div>
            <div class="dashboard">Stall Owner Dashboard</div>
        </nav>
    </header>

    <!-- Main content -->
    <main class="promotions-main">
        
        <!-- Create promotion button -->
        <section class="promotions-top-section">
            <button class="create-promotion-btn" id="createPromotionBtn">+ Create New Promotion</button>
        </section>

        <!-- Promotions container -->
        <section class="promotions-container">
            
            <!-- Filter buttons -->
            <div class="promotions-filters">
                <button class="promo-filter-btn active" data-filter="all">All Promotions</button>
                <button class="promo-filter-btn" data-filter="active">Active</button>
                <button class="promo-filter-btn" data-filter="scheduled">Scheduled</button>
                <button class="promo-filter-btn" data-filter="expired">Expired</button>
            </div>

            <!-- Promotions grid -->
            <!-- NOTE: Using mock/sample data. Will be replaced with Firebase later -->
            <div class="promotions-grid" id="promotionsGrid">
                <!-- Firebase -->
            </div>
        </section>

    </main>

    <!-- MODAL POPUP: Create/Edit Promotion -->
    <div class="modal" id="promotionModal">
        <div class="modal-overlay" onclick="closePromotionModal()"></div>
        <div class="modal-content promo-modal-content">
            <div class="modal-header">
                <div>
                    <h2 id="promoModalTitle">Create/Edit Promotions</h2>
                    <p class="modal-subtitle">Set up a special offer for your customers</p>
                </div>
                <button class="modal-close" onclick="closePromotionModal()">&times;</button>
            </div>
            
            <form class="modal-form" id="promotionForm">
                <!-- Promotion Title -->
                <div class="form-group">
                    <label for="promoTitle">Promotion Title</label>
                    <input 
                        type="text" 
                        id="promoTitle" 
                        placeholder="e.g. Weekend Special" 
                        required
                    >
                </div>

                <!-- Description -->
                <div class="form-group">
                    <label for="promoDescription">Description</label>
                    <textarea 
                        id="promoDescription" 
                        placeholder="Brief Description of the promotion"
                        rows="3"
                        required
                    ></textarea>
                </div>

                <!-- Discount type box -->
                <div class="form-group">
                    <label>Discount Type</label>
                    <div class="discount-type-buttons">
                        <button type="button" class="discount-type-btn active" data-type="percentage">Percentage (%)</button>
                        <button type="button" class="discount-type-btn" data-type="fixed">Fixed Amount ($)</button>
                        <button type="button" class="discount-type-btn" data-type="bogo">Buy X Get Y</button>
                    </div>
                </div>

                <!-- Type amount -->
                <div class="form-group" id="typeAmountGroup">
                    <label for="promoTypeAmount">Type Amount</label>
                    <input 
                        type="number" 
                        id="promoTypeAmount" 
                        placeholder="E.g. 20" 
                        min="0"
                    >
                </div>

                <!-- Buy X Get Y Fields (for BOGO) -->
                <div class="form-row" id="bogoFieldsGroup" style="display: none;">
                    <div class="form-group">
                        <label for="promoBuyQty">Buy Quantity</label>
                            <input 
                                type="number" 
                                id="promoBuyQty" 
                                placeholder="E.g. 2" 
                                min="1"
                            >
                    </div>
                    <div class="form-group">
                        <label for="promoGetQty">Get Quantity</label>
                        <input 
                            type="number" 
                            id="promoGetQty" 
                            placeholder="E.g. 1" 
                            min="1"
                        >
                    </div>
                </div>

                <!-- Start Date and End Date -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="promoStartDate">Start Date</label>
                        <input 
                            type="text" 
                            id="promoStartDate" 
                            placeholder="dd/mm/yy"
                            required
                        >
                    </div>
                    <div class="form-group">
                        <label for="promoEndDate">End Date</label>
                        <input 
                            type="text" 
                            id="promoEndDate" 
                            placeholder="dd/mm/yy"
                            required
                        >
                    </div>
                </div>

                <!-- Start Time and End Time  -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="promoStartTime">Start Time</label>
                        <input 
                            type="time" 
                            id="promoStartTime" 
                            placeholder="--:-- --"
                        >
                    </div>
                    <div class="form-group">
                        <label for="promoEndTime">End Time</label>
                        <input 
                            type="time" 
                            id="promoEndTime" 
                            placeholder="--:-- --"
                        >
                    </div>
                </div>

                <!-- Applicable items -->
                <div class="form-group">
                    <label for="promoApplicableItems">Applicable Items</label>
                    <input 
                        type="text" 
                        id="promoApplicableItems" 
                        placeholder="Selection Category"
                        required
                    >
                </div>

                <!-- Minimum spend -->
                <div class="form-group">
                    <label for="promoMinSpend">Minimum Spend ($)</label>
                    <input 
                        type="number" 
                        id="promoMinSpend" 
                        placeholder="Leave empty for no minimum" 
                        min="0"
                        step="0.01"
                    >
                </div>

                <!-- Action buttons -->
                <div class="modal-actions">
                    <button type="button" class="promo-cancel-btn" onclick="closePromotionModal()">Cancel</button>
                    <button type="submit" class="promo-create-btn">Create Promotion</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>© 2026 National Environment Agency. All rights reserved.</p>
    </footer>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="/js/kang-zheng.js"></script>
</body>
</html>
