<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Stall Owner</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/kang-zheng.css">
</head>
<body>
    <header>
        <div class="branding">
            <img src="/images/NEA-logo.png" alt="NEA logo">
        </div>
    
        <div class="nav-bar">
            <a href="#" class="back-btn">&larr;</a>
            <div class="nav-main">
                <div class="title">STALL OWNER</div>
            </div>
        </div>
    </header>

    <main class="auth-main">
        <div class="auth-container">
            <!-- Sign In Form Card -->
            <div class="auth-card">
                <h2 class="auth-title">Sign In</h2>
                
                <form class="auth-form" id="signInForm">
                    <!-- Email or Phone Number -->
                    <input 
                        type="text" 
                        class="auth-input" 
                        placeholder="Email or phone number"
                        required
                    >
                    
                    <!-- Password -->
                    <input 
                        type="password" 
                        class="auth-input" 
                        placeholder="Password"
                        required
                    >
                    
                    <!-- Log In Button -->
                    <button type="submit" class="auth-submit-btn">Log In</button>
                </form>
                
                <!-- Divider -->
                <div class="auth-divider">
                    <span>Or</span>
                </div>
            </div>
            
            <!-- Create Account Button -->
            <a href="stall-owner-signup.html" class="auth-secondary-btn">Create an account</a>
        </div>
    </main>

    <footer>
        <p>© 2026 National Environment Agency. All rights reserved.</p>
    </footer>

    <script src="/js/kang-zheng.js"></script>
</body>
</html>
